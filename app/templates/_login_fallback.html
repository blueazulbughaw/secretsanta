<!-- Server-rendered copy of the sign-in screens that pageLogin()/pagePhoneEntry() in app.js
     render client-side. Exists ONLY so the root URL (/) shows the real sign-in form AND the
     real SMS opt-in form (phone field + unchecked consent checkbox) to anything that fetches
     this page without running JavaScript - e.g. a texting-provider compliance reviewer, who
     has no way to click through a hash-routed JS screen change. Both are shown stacked on
     this one page for that reason; the live app keeps them as two separate screens (one
     primary action per screen). Once app.js boots, it replaces this with the live version, so
     a real browser sees only the sign-in screen first, same as always. Keep this in sync with
     pageLogin()/pagePhoneEntry() in static/js/app.js: same fields, button labels and consent
     wording, word for word - including the country dropdown's option list, which must match
     COUNTRY_CODES in static/js/app.js value for value. -->
<div class="center" style="margin-top:2rem">
  <div style="font-size:4rem">🎁</div>
  <h2>Welcome to Secret Santa</h2>
  <p class="muted">Family events made simple.</p>
</div>
<label for="username">Username</label>
<input id="username" autocomplete="username">
<label for="password">Password</label>
<div class="password-field">
  <input id="password" type="password" autocomplete="current-password">
  <button type="button" class="password-toggle" id="togglePw" aria-label="Show password">👁</button>
</div>
<div id="msg"></div>
<button class="btn btn-primary" id="loginBtn">Sign In</button>
<button class="btn btn-quiet" id="useCodeBtn">Use a Text Code Instead</button>
<p class="muted center" style="font-size:.78rem;margin-top:1.5rem">
  By continuing you agree to our
  <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>
  and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.
</p>

<hr style="margin:2rem 0">
